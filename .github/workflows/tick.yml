name: tick setiap 4 jam (menit ke-7, saran soal)

on:
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: panggil endpoint /api/tick
        run: |
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 \
            "${{ secrets.VERCEL_URL }}/api/tick")
          echo "$TS http=$CODE $(cat /tmp/resp.json)" >> log_calls_gh.log
          cat log_calls_gh.log
